<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenSol</title>
<style>
  :root { color-scheme: light dark; --bg:#f8f8f6; --ink:#171715; --muted:#62625d; --accent:#d97706; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f0f0e; --ink:#edede9; --muted:#a0a099; --accent:#f59e0b; } }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
  body{display:grid;place-items:center}
  .box{text-align:center;animation:in .6s cubic-bezier(.16,1,.3,1) both}
  .orb{width:46px;height:46px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7,transparent 40%),var(--accent);animation:pulse 1.6s ease-in-out infinite}
  h1{margin:0;font-size:20px;letter-spacing:-.03em}
  p{margin:8px 0 0;color:var(--muted);max-width:360px;line-height:1.5}
  .err{color:#cf3830;white-space:pre-wrap}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.86);opacity:.7}}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
  <div class="box">
    <div class="orb" id="orb"></div>
    <h1>OpenSol</h1>
    <p id="msg">Starting the local daemon…</p>
  </div>
<script>
  window.__opensolError = function (message) {
    document.getElementById('orb').style.animation = 'none';
    var el = document.getElementById('msg');
    el.className = 'err';
    el.textContent = message;
  };
</script>
</body>
</html>
