[package]
name = "opensol-desktop"
version = "3.2.3"
description = "OpenSol Desktop — the OpenSol coding agent in a native window (system webview)."
authors = ["OpenSoftX"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "opensol_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
