      content="OpenSol by OpenSoft is a local-first coding agent. Work in a real folder, run commands, edit files and deploy with your own model keys. Keys stay encrypted on your machine."

    <title>OpenSol — Local coding agent by OpenSoft</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      try {
        const NAMED = ['light', 'dark']
        const RETIRED = ['night-owl', 'claude-code', 'flame']
        const stored = localStorage.getItem('maxcode.theme')
        if (RETIRED.includes(stored)) localStorage.removeItem('maxcode.theme')
        const theme = NAMED.includes(stored)
          ? stored
          : window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        const root = document.documentElement
        root.dataset.theme = theme
        if (theme === 'dark') root.classList.add('dark')
      } catch {}
    </script>

    <link rel="stylesheet" crossorigin href="./assets/index-B6PUwkmA.css">
  </head>

    <div id="root"></div>
  </body>
